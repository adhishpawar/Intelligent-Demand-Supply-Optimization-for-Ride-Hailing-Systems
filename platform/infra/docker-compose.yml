# The documented, portable deployment shape (PLAN §4.3/§6.5). This is how the system
# deploys on any machine where container virtualization actually works.
#
# TONIGHT'S ENVIRONMENT NOTE (see PROGRESS.md for the full diagnosis): this sandbox
# cannot run WSL2/Hyper-V at all (confirmed via repeated `Wsl/Service/E_UNEXPECTED`
# failures predating this session, independent of Docker), so the system this session
# actually built and demoed runs on NATIVE Windows binaries instead (see
# `infra/native/` and `run.ps1`) — a Repository-pattern-enabled substitution, not a
# scope cut. On a machine where Docker/WSL2 works, `docker compose up` here is a
# drop-in replacement for `run.ps1`'s infra step; application code does not change
# either way (it only ever talks to host:port, never cares how the process got there).
#
# Cassandra is behind the `heavy` profile per PLAN §4.4 — bring it up explicitly with
# `docker compose --profile heavy up` if you want the real Cassandra location-history
# path; the default (`LOCATION_HISTORY_BACKEND=postgres`) needs only the three
# services below.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ridehail
      POSTGRES_USER: ridehail
      POSTGRES_PASSWORD: ridehail_dev_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridehail -d ridehail"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ridehail]

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ridehail]

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [ridehail]

  # PLAN §4.4: written and tested against the exact CQL schema from the HLD
  # (services/location/cassandra_repository.py), not the default backend tonight.
  cassandra:
    image: cassandra:4.1
    profiles: ["heavy"]
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ridehail
    volumes:
      - cassandradata:/var/lib/cassandra
    networks: [ridehail]

networks:
  ridehail:
    driver: bridge

volumes:
  pgdata:
  cassandradata:
