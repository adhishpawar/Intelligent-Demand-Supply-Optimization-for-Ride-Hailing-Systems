name: backend-ci

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ridehail
          POSTGRES_PASSWORD: ridehail_dev_pw
          POSTGRES_DB: rideops_ml_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ridehail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: pip install ruff==0.9.4 && ruff check app tests

      - name: Type check (mypy, non-blocking during initial rollout)
        run: pip install mypy==1.14.1 && mypy app --ignore-missing-imports || true

      - name: Unit tests
        run: python -m pytest tests/unit -v

      - name: API tests (real Postgres + Redis)
        env:
          DATABASE_URL: postgresql+asyncpg://ridehail:ridehail_dev_pw@localhost:5433/rideops_ml_test
          REDIS_URL: redis://localhost:6380/2
          JWT_SECRET: ci-test-secret-not-for-production
        run: python -m pytest tests/api -v

      - name: Build Docker image
        run: docker build -t rideops-backend:ci .
